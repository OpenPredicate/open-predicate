name: Release

# Publishing is irreversible, so the trigger is a deliberate act: draft a
# GitHub Release, publish it, and this ships the same commit to both registries.
#
# Use the workflow_dispatch entry point to rehearse — it defaults to a dry run,
# which exercises packaging and the already-published guard without uploading.
# A rehearsal cannot prove npmjs auth works, because the OIDC credential is
# only minted by a real publish; see RELEASING.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearse without publishing anything
        type: boolean
        default: true

# No ambient permissions; each job asks for exactly what it needs.
permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      npm-tag: ${{ steps.resolve.outputs.npm-tag }}
      dry-run: ${{ steps.resolve.outputs.dry-run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test

      # 0.6.0 shipped a `bin` that exited 0 having printed nothing, and nothing
      # here caught it: `npm test` and `npm run generate:example` both invoke the
      # generator by path, which is the one way that never crosses the symlink npm
      # installs a bin as. So install the tarball the way a user would, and drive
      # every entry point the README documents.
      - name: Smoke-test the packed artifact
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          npm pack --silent --pack-destination "$work" >/dev/null
          tarball="$(ls "$work"/*.tgz)"

          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install --silent "$tarball"

          # The bin, through the symlink — this is the case that regressed.
          out="$(./node_modules/.bin/open-predicate-generate --help)"
          case "$out" in
            *"derive a per-resource filter schema"*) ;;
            *) echo "::error::the installed bin produced no usable output"; exit 1 ;;
          esac

          # And it must still not run merely because it was imported.
          quiet="$(node --input-type=module -e 'await import("@open-predicate/open-predicate/generate");')"
          if [ -n "$quiet" ]; then
            echo "::error::importing the generator ran it"; exit 1
          fi

          # The three consumption paths README documents.
          node -e 'const s=require("@open-predicate/open-predicate"); if(!s.$id) throw new Error("require() returned no $id")'
          node --input-type=module -e 'import s from "@open-predicate/open-predicate" with { type: "json" }; if(!s.$id) throw new Error("ESM import returned no $id")'
          node --input-type=module -e 'import * as g from "@open-predicate/open-predicate/generate"; if (typeof g.generateFilterSchema !== "function") throw new Error("./generate does not export generateFilterSchema")'

          echo "packed artifact OK — bin, import attribute, and ./generate all work"

      - name: Resolve version and publish tag
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A release tag that disagrees with package.json means the registry
          # and the release notes would describe different things.
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            if [ "${RELEASE_TAG#v}" != "$version" ]; then
              echo "::error::Release tag '${RELEASE_TAG}' does not match package.json version '${version}'."
              exit 1
            fi
            if [ "$IS_PRERELEASE" = "true" ]; then
              echo "npm-tag=next" >> "$GITHUB_OUTPUT"
            else
              echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
            fi
            echo "dry-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
            echo "dry-run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarise
        run: |
          {
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`${{ steps.resolve.outputs.version }}\` |"
            echo "| npm dist-tag | \`${{ steps.resolve.outputs.npm-tag }}\` |"
            echo "| Dry run | \`${{ steps.resolve.outputs.dry-run }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  npmjs:
    name: Publish to npmjs.com
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this workflow's OIDC token for a
      # short-lived registry credential, so there is no NPM_TOKEN secret to
      # leak or rotate. The trust is configured on npmjs.com against the
      # repository *and this filename* — renaming this file breaks publishing
      # until the trusted publisher is updated to match.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships a new enough npm
      # today, but pin it rather than inherit whatever the runner image has.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@latest
          npm --version

      # One registry can succeed while the other fails, so a re-run must not
      # trip over its own earlier success.
      - name: Skip if this version is already published
        id: exists
        run: .github/scripts/version-published.sh
        env:
          VERSION: ${{ needs.verify.outputs.version }}

      # No NODE_AUTH_TOKEN, and no --provenance: trusted publishing supplies
      # the credential from the OIDC token above and attaches provenance by
      # default. --access public is what makes the first publish of a scoped
      # package public rather than restricted; publishConfig says the same.
      - name: Publish
        if: steps.exists.outputs.published != 'true'
        run: |
          npm publish \
            --access public \
            --tag '${{ needs.verify.outputs.npm-tag }}' \
            ${{ needs.verify.outputs.dry-run == 'true' && '--dry-run' || '' }}

  github-packages:
    name: Publish to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com

      # GitHub Packages accepts only scoped names, and the scope must be the
      # repository owner — lowercased, because npm rejects uppercase in a
      # package name and the owner here is `OpenPredicate`. npmjs.com carries
      # the @open-predicate scope instead, so rewrite the name here; the
      # tarball is otherwise identical.
      - name: Scope the package name to the repository owner
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          scope="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          npm pkg set name="@${scope}/${REPO}"
          node -p "require('./package.json').name"

      # GitHub Packages has no OIDC trusted-publishing equivalent, so this one
      # stays token-authenticated. GITHUB_TOKEN is minted per run and expires
      # with it, so there is still no long-lived secret in the repository.
      - name: Check authentication
        run: npm whoami --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this version is already published
        id: exists
        run: .github/scripts/version-published.sh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          REGISTRY: https://npm.pkg.github.com
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: steps.exists.outputs.published != 'true'
        run: |
          npm publish \
            --tag '${{ needs.verify.outputs.npm-tag }}' \
            ${{ needs.verify.outputs.dry-run == 'true' && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
